# experimental C-b bug fix
set -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

# tmux window pane info
bind -n MouseDown1Status switch-client -t =
set -g status 2
set -g status-format[1] '#[align=left]#{W:#[fg=black]#[range=window|#{window_index}]   W#I#{?automatic-rename,,:#W}#[norange]  #{P:#[range=pane|#{pane_id}]P#{pane_index}(#{?#{e|>:#{n:pane_current_command},5},#{=3:pane_current_command}..,#{pane_current_command}})#[norange] } #[fg=black]│,#[fg=white,bg=black,bold]#[range=window|#{window_index}] ▶ W#I#{?automatic-rename,,:#W}#[norange]  #[nobold]#{P:#[range=pane|#{pane_id}]P#{pane_index}(#{?#{e|>:#{n:pane_current_command},5},#{=3:pane_current_command}..,#{pane_current_command}})#[norange] ,#[fg=green,bold]#[range=pane|#{pane_id}]▸P#{pane_index}(#{?#{e|>:#{n:pane_current_command},5},#{=3:pane_current_command}..,#{pane_current_command}})#[norange]#[fg=white,nobold] }#[default]│}'

# original
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g extended-keys always
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

set -g focus-events on
setw -g mode-keys vi

# j/k: pane
bind j select-pane -t :.-
bind k select-pane -t :.+

# status right: host:user instead of clock
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" #h:#{user}'
