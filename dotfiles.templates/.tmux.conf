# experimental C-b bug fix
set -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g extended-keys always
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

set -g focus-events on
setw -g mode-keys vi

# clipboard — 어떤 터미널/SSH 경로에서도 OSC 52 가 바깥 터미널까지 닿게 한다.
#   set-clipboard on   : pane 안의 앱(Claude Code, vim, …)이 보낸 OSC 52 를 받아
#                        바깥 터미널로 다시 보낸다. 기본값 external 은 앱이 보낸 것을 버린다.
#   *:clipboard        : 기본값은 TERM 이 xterm* 일 때만 바깥 터미널이 OSC 52 를 지원한다고
#                        가정한다. alacritty, wezterm, 중첩 tmux 등에서도 보내도록 넓힌다.
#   mouse on           : Claude Code 전체화면 모드가 휠/드래그를 직접 받는다.
#                        tmux 자체 선택은 Shift(또는 iTerm2 의 Option)+드래그.
set -s set-clipboard on
set -as terminal-features '*:clipboard'
set -g mouse on

# 다른 머신에서 다시 attach 할 때 SSH/디스플레이 변수를 새로 받아온다.
# 이게 낡아 있으면 Claude Code 가 SSH 인데 로컬로 착각해(또는 반대로)
# 엉뚱한 머신의 클립보드에 복사한다 — "어떨 땐 되고 어떨 땐 안 되는" 주범.
set -ga update-environment 'SSH_CLIENT SSH_TTY WAYLAND_DISPLAY'

# copy-mode(vi): v 로 선택, y 로 복사 — set-clipboard 덕분에 시스템 클립보드까지 간다.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# j/k: pane
bind j select-pane -t :.-
bind k select-pane -t :.+
