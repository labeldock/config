# Each setting is tagged README-TMUX-CONF#N.
# Background and details: https://github.com/labeldock/config/blob/main/README-TMUX-CONF.md

# Prefix: pin C-b, press C-b twice to send a literal C-b (README-TMUX-CONF#1)
set -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

# Remember the outer terminal on attach (README-TMUX-CONF#2)
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Extended keys: let apps tell Shift+Enter from Enter (README-TMUX-CONF#3)
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Passthrough: let app escape sequences reach the outer terminal (README-TMUX-CONF#4)
set -g allow-passthrough on

# Focus events: tell apps when the pane gains or loses focus (README-TMUX-CONF#5)
set -g focus-events on

# Vi keys in copy mode (README-TMUX-CONF#6)
setw -g mode-keys vi

# Clipboard: forward app OSC 52 copies to the outer terminal (README-TMUX-CONF#7)
set -s set-clipboard on
set -as terminal-features '*:clipboard'

# Mouse: wheel and drag go to tmux and fullscreen apps (README-TMUX-CONF#8)
set -g mouse on

# Refresh SSH and display variables on attach (README-TMUX-CONF#9)
set -ga update-environment 'SSH_CLIENT SSH_TTY WAYLAND_DISPLAY'

# Copy mode: v to select, y to copy (README-TMUX-CONF#10)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# j/k: previous / next pane (README-TMUX-CONF#11)
bind j select-pane -t :.-
bind k select-pane -t :.+
