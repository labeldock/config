# experimental C-b bug fix
set -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

# status line 1: W<window>P<pane> + active pane title (set by the running app, e.g. Claude Code's task summary) on the left, session name on the right
# status line 2: windows and panes (P<index><first 3 chars of command>) on the left, host:user on the right
bind -n MouseDown1Status switch-client -t =
set -g status 2
set -g status-format[0] '#[align=left] W#{window_index}P#{pane_index} #{pane_title}#[align=right]#{session_name} '
set -g status-format[1] '#[align=left]#{W:#[fg=black]#[range=window|#{window_index}]   W#I#{?automatic-rename,,:#W}#[norange]  #{P:#[range=pane|#{pane_id}]P#{pane_index}#{=3:pane_current_command}#[norange] } #[fg=black]│,#[fg=white,bg=black,bold]#[range=window|#{window_index}] ▶ W#I#{?automatic-rename,,:#W}#[norange]  #[nobold]#{P:#[range=pane|#{pane_id}]P#{pane_index}#{=3:pane_current_command}#[norange] ,#[fg=green,bold]#[range=pane|#{pane_id}]▸P#{pane_index}#{=3:pane_current_command}#[norange]#[fg=white,nobold] }#[default]│}#[align=right]#h:#{user} '

# original
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g extended-keys always
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

set -g focus-events on
setw -g mode-keys vi

# j/k: pane
bind j select-pane -t :.-
bind k select-pane -t :.+
